<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<title>流亡者</title>
<style>
  :root {
    --bg0:#0b0a08; --bg1:#14110b; --raise:#1a150d;
    --ink:#dcd6c8; --muted:#8c8576; --faint:#847d6b;
    --gold:#e6c570; --gold-dim:#9d7e3a; --gold-soft:rgba(214,178,92,.32);
    --line:#2c271d; --shadow:0 8px 28px rgba(0,0,0,.5);
    --red:#cd6a5f; --cyan:#6fb7c7; --green:#7bb56e; --mag:#c08acb;
    --mono:"Sarasa Mono TC","Noto Sans Mono CJK TC","WenQuanYi Micro Hei Mono","Consolas","DejaVu Sans Mono","monospace";
    --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","STSong","PMingLiU","新細明體",serif;
    --sans:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; color:var(--ink); font-family:var(--sans); line-height:1.5;
    background:radial-gradient(130% 85% at 50% -12%, #221b10 0%, #110d09 48%, #080705 100%) fixed, var(--bg0);
    min-height:100vh; }
  /* 手機防溢出:flex 子元素允許收縮、長字可斷,避免某元素撐出最小寬度卡死響應斷點 */
  #app, #screen, #prompt, #hud, .card, .vstatus, .meter, .m-track, .cline, .cbt,
  .h-meta, .h-vitals, .loc-exits, .btns, .sheet-grid, .skills, .attrs,
  .attr, .sk, .cname, .kv { min-width:0; }
  .loc-desc, .card-head, .p-line, .kv, .logline span, .q-obj, .sheet-sub { overflow-wrap:anywhere; }
  #app { max-width:880px; margin:0 auto;
    padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
            calc(34px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); }

  #masthead { padding:10px 2px 8px; background:linear-gradient(var(--bg0) 64%, transparent); text-align:center; }
  .brand { font-family:var(--serif); font-weight:700; color:var(--gold);
    font-size:clamp(21px,5.6vw,30px); letter-spacing:.22em; padding-left:.22em;
    text-shadow:0 0 18px rgba(214,178,92,.28); }
  .orn { color:var(--gold-dim); font-size:12px; letter-spacing:.32em; margin-top:2px; }
  #status { display:flex; gap:7px; align-items:center; justify-content:center; margin-top:6px;
    font-size:11.5px; color:var(--faint); }
  #dot { width:8px; height:8px; border-radius:50%; background:#5b8f54; box-shadow:0 0 7px #5b8f54;
    transition:background .2s, box-shadow .2s; }
  #dot.off { background:#a8584f; box-shadow:0 0 7px #a8584f; }
  /* 常駐生命 HUD(sticky,跨所有子畫面) */
  #hud { position:sticky; top:0; z-index:7; display:none; flex-wrap:wrap; align-items:center; gap:6px 12px;
    padding:7px calc(10px + env(safe-area-inset-right)) 7px calc(10px + env(safe-area-inset-left));
    background:linear-gradient(#100d08,#0c0a07); border-bottom:1px solid var(--gold-soft);
    box-shadow:0 5px 14px rgba(0,0,0,.45); font-size:12.5px; transition:border-color .2s; }
  #hud.off { border-bottom-color:#a8584f; }
  #hud .h-meta { display:flex; flex-wrap:wrap; align-items:center; gap:5px 10px; min-width:0; }
  #hud .h-vitals { display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px; min-width:0; }
  @media (max-width:560px) { #hud .h-vitals { flex-basis:100%; } }
  #hud .h-name { font-weight:700; color:var(--ink); } #hud .h-lv { color:var(--gold); font-weight:700; }
  #hud .h-time { color:var(--muted); }
  #hud .hm { display:flex; align-items:center; gap:4px; }
  #hud .hm .l { color:var(--muted); }
  #hud .hm .t { display:inline-block; width:52px; height:8px; border-radius:5px; background:#0d0b07;
    border:1px solid var(--line); overflow:hidden; vertical-align:middle; }
  #hud .hm .f { display:block; height:100%; }
  #hud .hm .f.hp { background:linear-gradient(90deg,#7a2e29,var(--red)); }
  #hud .hm .f.mp { background:linear-gradient(90deg,#2b5a64,var(--cyan)); }
  #hud .hm .f.fp { background:linear-gradient(90deg,#365a30,var(--green)); }
  #hud .hm .v { color:var(--ink); font-variant-numeric:tabular-nums; }
  #hud .h-gold { color:var(--gold); }
  #hud .h-chip { font-size:11px; padding:1px 7px; border-radius:9px; border:1px solid var(--line); }
  #hud .h-chip.red { color:#e08b82; border-color:#5a2f2a; }
  #hud .h-chip.cyan { color:#7fd0d8; border-color:#2f5157; }   /* R114:祝福/限時增益 chip(原無此規則→顯示為預設灰) */
  #hud .h-team-wrap { display:flex; flex-wrap:wrap; gap:3px 12px; flex-basis:100%; font-size:11px; }
  #hud .h-team { color:#7fb6c4; font-variant-numeric:tabular-nums; }
  #hud .h-team.summon { color:#c89bd6; }
  #hud .h-team.down { color:#a8584f; }
  #hud .h-chip.gold { color:var(--gold); border-color:var(--gold-soft); }
  #hud .h-chip.mag { color:var(--mag); border-color:#4a2f52; }   /* R106 靈魂 token chip */

  /* 畫面:原生 block 串(view 元件 / html 退路)垂直堆疊 */
  #screen { display:flex; flex-direction:column; gap:12px; margin-top:6px; }

  /* 卡片 */
  .card { border:1px solid var(--gold-soft); border-radius:11px; background:linear-gradient(#15110a,#100d07);
    box-shadow:var(--shadow); padding:14px 16px; }
  .card-head { font-family:var(--serif); color:var(--gold); font-weight:700;
    font-size:clamp(15px,4vw,18px); display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; }
  .dim { color:var(--muted); font-weight:400; font-size:13px; }
  .faint { color:var(--faint); }

  /* 資源計量條 */
  .meters { display:flex; flex-direction:column; gap:7px; }
  .meter { display:flex; align-items:center; gap:9px; font-size:13.5px; }
  .m-lab { width:2.4em; color:var(--muted); flex:none; }
  .m-track { flex:1; height:13px; border-radius:7px; background:#0d0b07;
    border:1px solid var(--line); overflow:hidden; }
  .m-fill { height:100%; border-radius:6px 0 0 6px; transition:width .25s ease; }
  .m-val { flex:none; font-variant-numeric:tabular-nums; color:var(--ink); min-width:4.6em; text-align:right; }
  .hp .m-fill{background:linear-gradient(90deg,#7a2e29,var(--red));}
  .mp .m-fill{background:linear-gradient(90deg,#2b5a64,var(--cyan));}
  .fp .m-fill{background:linear-gradient(90deg,#365a30,var(--green));}

  /* 狀態列 */
  .vstatus { border:1px solid var(--line); border-radius:11px; background:#100d08; padding:11px 14px; }
  .vs-line { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 12px; margin-bottom:9px; }
  .vs-name { font-weight:700; color:var(--ink); }
  .vs-lv { color:var(--gold); font-weight:700; }
  .vs-time { color:var(--muted); font-size:13px; }
  .vs-levelup { margin-top:9px; color:var(--gold); font-weight:700; }
  .chip { font-size:11.5px; padding:2px 9px; border-radius:11px; border:1px solid var(--line);
    color:var(--muted); background:#16120b; }
  .chip.red{color:#e08b82;border-color:#5a2f2a;} .chip.gold{color:var(--gold);border-color:var(--gold-soft);}
  .chip.cyan{color:var(--cyan);border-color:#2b4a52;} .chip.mag{color:var(--mag);border-color:#4a2f52;}
  .chip.green{color:var(--green);border-color:#2f4a2b;}
  .opt-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;} .opt .chip{font-size:10.5px;padding:1px 7px;}

  /* 地點 */
  .loc-desc { margin:9px 0 2px; color:var(--ink); }
  .loc-line { margin-top:7px; color:var(--ink); }
  .loc-line .lab { color:var(--gold-dim); margin-right:6px; }
  .loc-exits { margin-top:10px; display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .loc-exits .lab { color:var(--gold-dim); }
  .ex { font-size:12.5px; padding:3px 10px; border-radius:8px; border:1px solid var(--line);
    background:#15110a; color:var(--ink); }
  .ex .h { color:var(--muted); margin-left:5px; }

  /* 角色卡 */
  .sheet-sub { color:var(--muted); font-size:13px; margin:4px 0 12px; }
  .sheet-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 22px; }
  @media (max-width:560px){ .sheet-grid{ grid-template-columns:1fr; } }
  .kv { font-size:13.5px; margin-top:5px; } .kv .lab{ color:var(--gold-dim); margin-right:8px; }
  .attrs { display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; align-content:start; }
  @media (max-width:560px){ .attrs{ grid-template-columns:1fr; } }
  .attr { display:flex; justify-content:space-between; font-size:13.5px; border-bottom:1px dotted var(--line);
    padding:3px 0; }
  .attr .star{ color:var(--gold); } .attr .v{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; flex:none; white-space:nowrap; }
  .attr > span:first-child{ min-width:0; overflow-wrap:anywhere; }
  .sec-title { margin:14px 0 8px; color:var(--gold-dim); font-weight:700; font-size:12.5px; letter-spacing:.1em;
    display:flex; align-items:center; gap:10px; }
  .sec-title::after{ content:""; flex:1; height:1px; background:linear-gradient(to right,var(--gold-soft),transparent); }
  .skills { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px 16px; }
  @media (max-width:560px){ .skills{ grid-template-columns:1fr; } }
  .skcol h4 { margin:0 0 5px; font-size:13px; }
  .skcol.combat h4{color:var(--red);} .skcol.magic h4{color:var(--cyan);} .skcol.stealth h4{color:var(--green);}
  .sk { display:flex; justify-content:space-between; font-size:13px; padding:2px 0; color:var(--ink); }
  .sk .nm{ min-width:0; overflow-wrap:anywhere; } .sk .nm .mj{ color:var(--gold); } .sk .lv{ color:var(--muted); font-variant-numeric:tabular-nums; flex:none; white-space:nowrap; }
  .mast { margin-top:5px; color:var(--mag); font-size:13px; } .mast .mn{ font-weight:700; } .mast .md{ color:var(--muted); }
  .efx { margin-top:8px; color:var(--cyan); font-size:13px; }

  /* divider + html 退路 */
  .divider { display:flex; align-items:center; gap:12px; color:var(--gold-dim); font-size:12.5px; }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--line); }
  pre.art { position:relative; margin:0; padding:13px 15px; overflow-x:auto; white-space:pre; color:var(--ink);
    background:#0a0806; border:1px solid var(--gold-soft); border-radius:10px; font-family:var(--mono);
    font-size:clamp(11px,2.75vw,15px); line-height:1.3; -webkit-overflow-scrolling:touch;
    scrollbar-width:thin; scrollbar-color:var(--gold-dim) transparent; }
  pre.art::-webkit-scrollbar{ height:7px; } pre.art::-webkit-scrollbar-thumb{ background:var(--gold-dim); border-radius:4px; }
  @keyframes settle { from{opacity:.5;} to{opacity:1;} }
  #screen > * { animation:settle .18s ease; }

  /* 互動區 */
  #prompt { margin-top:16px; }
  .ptitle { font-family:var(--serif); color:var(--gold); font-weight:700; font-size:clamp(15px,4.2vw,19px);
    margin:2px 2px 12px; letter-spacing:.02em; }
  .ghead { color:var(--gold-dim); font-weight:700; font-size:12.5px; letter-spacing:.12em; margin:14px 2px 7px;
    display:flex; align-items:center; gap:10px; }
  .ghead::after{ content:""; flex:1; height:1px; background:linear-gradient(to right,var(--gold-soft),transparent); }
  .btns { display:flex; flex-wrap:wrap; gap:9px; }
  /* 帶 chips 的選卡選單(種族/星座/職業/開局):改用等寬 grid → 孤卡/末排不再撐滿整排(flex grow 之疾)。
     auto-fill 保留空軌 → 單張卡維持單欄寬;minmax 230px 對齊原 flex-basis,欄數不變。動作/確認選單仍走 flex。 */
  .btns.cardgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); align-items:stretch; }
  .btns.cardgrid button.opt { flex:none; }
  button.opt { flex:1 1 230px; min-height:50px; padding:12px 15px; cursor:pointer; text-align:left; font-size:15px;
    font-family:var(--sans); color:var(--ink); background:linear-gradient(#191409,#130f08); border:1px solid var(--line);
    border-radius:9px; transition:transform .1s ease, border-color .12s, background .12s, box-shadow .12s; }
  button.opt:hover { border-color:var(--gold-soft); background:linear-gradient(#221a0d,#181208);
    transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.4); }
  button.opt:active { transform:translateY(0) scale(.992); background:#241c0e; }
  button.opt:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  button.opt .num { display:inline-block; min-width:1.5em; margin-right:9px; color:var(--gold); font-weight:700;
    font-variant-numeric:tabular-nums; }
  button.back { flex-basis:100%; color:var(--muted); background:linear-gradient(#141009,#100c07); }
  button.yes { border-color:var(--gold-soft); } button.no { color:var(--muted); }
  .row { display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
  input.field { flex:1 1 170px; min-height:50px; padding:11px 14px; font-size:16px; color:var(--ink);
    background:#0d0a06; border:1px solid var(--line); border-radius:9px; font-family:var(--sans); }
  input.field:focus { outline:none; border-color:var(--gold-dim); box-shadow:0 0 0 3px rgba(214,178,92,.22); }
  button.go { min-height:50px; padding:11px 26px; font-size:15px; cursor:pointer; font-weight:700; color:#1a1206;
    background:linear-gradient(#e8cb78,#caa64e); border:none; border-radius:9px; transition:transform .1s, filter .12s; }
  button.go:hover { filter:brightness(1.08); transform:translateY(-1px); } button.go:active { transform:translateY(0) scale(.99); }
  .hint { color:var(--faint); font-size:12px; margin:9px 2px 0; }
  .end { font-family:var(--serif); color:var(--gold); font-weight:700; font-size:17px; padding:14px 2px; letter-spacing:.04em; }
  #foot { text-align:center; color:var(--faint); font-size:11px; margin-top:22px; letter-spacing:.04em; }
  .locked { opacity:.45; pointer-events:none; }
  @media (hover:none) { button.opt:hover { transform:none; box-shadow:none; } }

  /* 戰鬥 */
  .m-fill.hp{background:linear-gradient(90deg,#7a2e29,var(--red));}
  .m-fill.mp{background:linear-gradient(90deg,#2b5a64,var(--cyan));}
  .m-fill.fp{background:linear-gradient(90deg,#365a30,var(--green));}
  .combat .cside{display:flex;flex-direction:column;gap:8px;}
  .vs{text-align:center;color:var(--red);font-weight:700;letter-spacing:.18em;margin:11px 0;font-size:13px;}
  .cbt{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#100d08;}
  .cbt.foe{border-color:#3a2622;} .cbt.down{color:var(--faint);text-decoration:line-through;}
  .cname{font-weight:600;margin-bottom:5px;} .cidx{color:var(--gold);font-weight:700;}
  .cline{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:3px;}
  .clab{color:var(--muted);width:1.4em;flex:none;}
  .cval{flex:none;color:var(--ink);font-variant-numeric:tabular-nums;min-width:4.6em;text-align:right;white-space:nowrap;}
  .ct{font-size:11px;color:var(--mag);border:1px solid #3a2f42;border-radius:9px;padding:0 7px;}
  .ct.buff{color:var(--green);border-color:#365a30;} .ct.debuff{color:var(--red);border-color:#5a302b;}
  .cbt.foe.tappable{cursor:pointer;}
  .cbt.foe.tappable:hover{border-color:var(--gold-soft);background:rgba(214,178,92,.07);}
  .cbt.foe.tappable:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
  /* 背包 */
  .inv{margin-top:8px;display:flex;flex-direction:column;}
  .inv-row{padding:6px 2px;border-bottom:1px dotted var(--line);font-size:14px;}
  .inv-foot{display:flex;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:13.5px;}
  .gold{color:var(--gold);}
  .ik{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:9px;vertical-align:middle;background:var(--muted);}
  .ik.weapon{background:var(--red);} .ik.armor{background:var(--cyan);} .ik.potion{background:var(--green);} .ik.jewelry{background:var(--gold);}
  .ik.book{background:#b48ead;} .ik.soul_gem{background:#9d7fe0;} .ik.ingredient{background:#8fae6e;}
  /* 背包:負重條 + 種類分組 + 品質色階(R-inv) */
  .inv-weight{display:flex;align-items:center;gap:8px;margin:8px 0 4px;font-size:12.5px;}
  .inv-weight .iw-lab{color:var(--gold-dim);font-weight:700;flex:0 0 auto;} .inv-weight .m-track{flex:1;}
  .inv-weight .iw-val{flex:0 0 auto;color:var(--muted);font-variant-numeric:tabular-nums;}
  .inv-grp{margin-top:10px;} .inv-grp:first-child{margin-top:4px;}
  .inv-grp-h{font-family:var(--serif);color:var(--gold-dim);font-weight:700;font-size:12.5px;letter-spacing:.04em;
    padding-bottom:3px;margin-bottom:2px;border-bottom:1px solid var(--gold-soft);}
  .tier-common{color:var(--ink);} .tier-uncommon{color:#7fb069;} .tier-rare{color:#6ea8d8;} .tier-legendary{color:var(--gold);}
  /* 地圖 */
  .mprov{margin-top:12px;} .mprov-h{color:var(--cyan);font-weight:700;margin-bottom:6px;font-size:14px;}
  .mprov-n{color:var(--faint);font-size:11px;font-weight:400;margin-left:8px;}
  .mnode{padding:5px 9px;border-left:2px solid var(--line);margin:3px 0 3px 4px;font-size:13px;}
  .mnode.here{border-color:var(--gold);background:rgba(214,178,92,.06);} .mnode.unseen{color:var(--faint);}
  .mn-name{color:var(--ink);} .mnode.unseen .mn-name{color:var(--faint);} .mn-type{color:var(--muted);font-size:12px;}
  .here{color:var(--gold);} .unseen{color:var(--faint);}
  .fac{color:var(--gold-dim);font-size:11px;border:1px solid var(--line);border-radius:8px;padding:0 5px;margin-left:5px;}
  .lm{color:var(--gold);margin-left:5px;} .svc{color:var(--faint);font-size:11px;margin-left:7px;}
  .mnex{color:var(--faint);font-size:11.5px;margin-top:2px;}
  .maplegend{color:var(--faint);font-size:11px;margin-top:13px;border-top:1px solid var(--line);padding-top:9px;}
  /* 相對位置地圖(總覽 + 行省放大) */
  .mzbar{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px;}
  .mzb{font-size:11.5px;padding:2px 9px;background:var(--raise);border:1px solid var(--line);border-radius:11px;color:var(--ink);cursor:pointer;}
  .mzb.active{border-color:var(--gold);color:var(--gold);}
  .mapstage{position:relative;width:100%;max-width:600px;margin:6px auto 2px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:grab;touch-action:pan-y;}
  .mapstage.grabbing{cursor:grabbing;}
  .mapzoom{position:absolute;inset:0;width:100%;height:100%;transform-origin:0 0;}
  .mapedges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}
  .mapedges line{stroke:var(--gold-dim);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.5;}
  .mapedges line.cross{stroke:#5fc6d8;stroke-width:1.6;vector-effect:non-scaling-stroke;opacity:.9;}
  .mmark{position:absolute;transform:translate(-50%,-50%);font-size:15px;line-height:1;color:#b8b09c;white-space:nowrap;cursor:pointer;z-index:3;padding:7px;}
  .mmark.vis{color:var(--ink);} .mmark.unseen{color:#9a927f;opacity:.85;}
  .mmark.here{color:var(--gold);font-weight:700;z-index:5;text-shadow:0 0 7px var(--gold-soft);}
  .mmark.d1{color:#e0c074;} .mmark.d2{color:#ecac4a;} .mmark.d4{color:#ee6f62;}
  .mmark.border{color:#5fc6d8;}   /* 邊境=省界通道,專屬青色 */
  .mmark.wild{font-size:20px;}    /* 荒野原本 · 太小,放大成清楚的圓點 */
  .mmark.sel{text-shadow:0 0 8px var(--gold-soft);}
  /* R114 F5:任務目標(金環)/ 重踞可再掃地城(紅角)標記 */
  .mflag{position:absolute;right:-1px;font-size:10px;line-height:1;pointer-events:none;z-index:6;}
  .mflag.q{top:-2px;color:var(--gold);text-shadow:0 0 4px var(--gold-soft);}
  .mflag.r{bottom:-2px;color:#ee6f62;text-shadow:0 0 4px #000;}   /* 紅角置底右 → 與金環(頂右)可並存不疊 */
  .mlabel{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:1px;font-size:9px;line-height:1;white-space:nowrap;color:var(--ink);text-shadow:0 0 3px #000,0 0 2px #000,0 0 2px #000;display:none;pointer-events:none;}
  .mhour{position:absolute;transform:translate(-50%,-50%);font-size:9px;color:var(--gold);z-index:2;pointer-events:none;display:none;text-shadow:0 0 3px #000,0 0 2px #000,0 0 2px #000;}
  .mapstage.prov .mlabel,.mapstage.zoomed .mlabel{display:inline;}
  .mapstage.prov .mhour,.mapstage.zoomed .mhour{display:inline-block;}
  .maphint{color:var(--faint);font-size:10.5px;text-align:right;margin:-2px 2px 0;}
  .mapinfo{min-height:20px;margin:8px 2px 0;font-size:13px;color:var(--ink);}
  .mapinfo .mi-type{color:var(--muted);font-size:12px;} .mapinfo .mi-svc{color:var(--gold);margin-left:6px;}
  .mapinfo .mi-hint{color:var(--faint);font-size:12px;}
  /* 面板內「前往」按鈕(pan surface 之外 → 點擊旅行零拖曳衝突) */
  .mapinfo .mi-go{margin-left:8px;vertical-align:middle;font-size:12px;font-weight:700;padding:3px 12px;cursor:pointer;
    color:#1a1206;background:linear-gradient(#e8cb78,#caa64e);border:none;border-radius:8px;font-family:var(--sans);
    transition:filter .12s, transform .1s;}
  .mapinfo .mi-go:hover{filter:brightness(1.08);transform:translateY(-1px);} .mapinfo .mi-go:active{transform:translateY(0);}
  .mapinfo .mi-go:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .mzb.ctl{font-weight:700;min-width:2.4em;text-align:center;}
  /* 地城格子 */
  .dgrid{display:grid;gap:5px;margin:12px 0 4px;max-width:340px;}
  .dgcell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:17px;
    border:1px solid var(--line);border-radius:5px;background:#15120c;color:var(--faint);user-select:none;}
  .dg-fog{color:#4a443a;background:#100e09;}
  .dg-seen{color:var(--muted);background:#1c1810;}
  .dg-cur{color:#101010;background:var(--gold);border-color:var(--gold);font-weight:700;}
  .dg-stairs{color:var(--cyan);} .dg-boss{color:var(--red);border-color:var(--red);} .dg-entrance{color:var(--green);}
  .dgcell[data-key]{cursor:pointer;border-color:var(--gold-dim);}
  .dgcell[data-key]:hover{background:#2a2414;}
  /* 任務 */
  .quest{padding:8px 2px;border-bottom:1px dotted var(--line);} .q-name{font-weight:600;} .q-fac{color:var(--gold-dim);}
  .q-obj{color:var(--muted);font-size:13px;margin-top:2px;}
  /* 領地表 */
  .tt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
  .tt th{color:var(--gold-dim);text-align:left;padding:5px 9px;border-bottom:1px solid var(--line);font-weight:700;}
  .tt td{padding:5px 9px;border-bottom:1px dotted var(--line);color:var(--ink);white-space:nowrap;}
  .tt th:first-child,.tt td:first-child{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line);}
  .tt td:first-child{background:#100d08;} .tt th:first-child{background:#15110a;z-index:2;}
  /* 傳奇結算 */
  .legacy{max-width:560px;margin:0 auto;text-align:center;border-color:var(--gold-soft);box-shadow:0 0 40px rgba(214,178,92,.07),var(--shadow);}
  .lg-head{font-family:var(--serif);color:var(--gold);font-size:18px;letter-spacing:.12em;}
  .lg-name{font-family:var(--serif);color:var(--gold);font-size:23px;font-weight:700;margin-top:8px;}
  .lg-sec{max-width:360px;margin:0 auto;}
  .lg-rows{margin:4px auto 14px;max-width:360px;text-align:left;}
  .lg-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted var(--line);}
  .lg-k{color:var(--gold-dim);} .lg-v{color:var(--ink);}
  .lg-skills{color:var(--muted);font-size:13px;margin:10px 0;}
  .lg-score{margin-top:14px;color:var(--gold-dim);font-size:12px;letter-spacing:.1em;}
  .lg-num{font-family:var(--serif);color:var(--gold);font-size:32px;font-weight:700;line-height:1.1;margin-top:4px;}
  .lg-title{color:var(--mag);font-weight:700;margin-top:6px;font-size:15px;}
  /* 通用面板(sheet_* 子檢視) */
  .panel-body{margin-top:8px;} .p-head{color:var(--gold);font-weight:700;margin:11px 0 5px;font-size:14px;}
  .p-line{margin:4px 0;font-size:14px;color:var(--ink);}
  /* 里程碑卡 */
  .mst-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  @media (max-width:560px){ .mst-grid{ grid-template-columns:1fr; } }
  .mst{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#100d08;min-width:0;}
  .mst.on{border-color:#3f2f46;background:linear-gradient(#181020,#120d09);}
  .mst-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;font-weight:700;}
  .mst.on .mst-h{color:var(--mag);} .mst.off .mst-h{color:var(--ink);}
  .mst-mk{color:var(--mag);} .mst-mk.off{color:var(--faint);}
  .mst-sk{font-size:11.5px;font-weight:400;color:var(--gold-dim);}
  .mst .m-track{margin:7px 0 5px;} .mst-d{font-size:12.5px;color:var(--muted);}
  /* 里程碑手風琴(按 系統→技能 折疊;節點配對卡 + ✦/◆/○ 三態) */
  .mst-acc{margin-top:6px;}
  .mst-acc .sec-title{margin:14px 0 6px;}
  .mskill{border:1px solid var(--line);border-radius:9px;background:#100d08;margin:6px 0;overflow:hidden;}
  .msk-head{display:flex;flex-wrap:wrap;align-items:center;gap:5px 9px;padding:8px 11px;cursor:pointer;user-select:none;}
  .msk-head:hover{background:rgba(214,178,92,.05);}
  .msk-head:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
  .msk-caret{color:var(--gold-dim);width:.9em;flex:none;}
  .msk-name{font-weight:700;color:var(--ink);}
  .msk-dots{display:flex;gap:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums;}
  .mdot{font-size:11px;}
  .mdot.chosen{color:var(--mag);} .mdot.pending{color:var(--gold);} .mdot.future{color:var(--faint);}
  .msk-meta{margin-left:auto;font-size:11.5px;color:var(--muted);}
  .msk-pend{color:var(--gold);}
  .msk-body{display:none;padding:0 11px 8px;}
  .mskill.exp .msk-body{display:block;}
  .msk-node{border-top:1px dotted var(--line);padding:7px 0 6px;display:flex;flex-direction:column;gap:5px;min-width:0;}
  .mn-thr{font-size:12px;font-weight:700;display:flex;align-items:baseline;gap:7px;}
  .msk-node.chosen .mn-thr{color:var(--mag);} .msk-node.pending .mn-thr{color:var(--gold);} .msk-node.future .mn-thr{color:var(--faint);}
  .mn-rem{font-weight:400;color:var(--faint);font-size:11px;}
  .mn-pair{display:flex;gap:8px;align-items:stretch;min-width:0;}
  @media (max-width:560px){ .mn-pair{flex-direction:column;} }
  .mn-opt{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#15110a;}
  .mn-opt.sole{background:transparent;border:none;padding:4px 0;}
  .mn-on{display:block;font-size:13px;font-weight:600;color:var(--ink);overflow-wrap:anywhere;}
  .msk-node.future .mn-on{color:var(--muted);font-weight:500;}
  .mn-opt.chosen .mn-on{color:var(--mag);}
  .mn-od{display:block;font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;}
  .mn-auto{font-size:10.5px;color:var(--gold-dim);font-weight:400;}
  .mn-fg{font-size:11px;color:var(--faint);margin-left:6px;}
  .mn-vs{align-self:center;font-size:10.5px;color:var(--gold-dim);flex:none;}
  @media (max-width:560px){ .mn-vs{align-self:flex-start;} }
  /* 抗性量表 */
  .rz-grid{margin-top:9px;display:flex;flex-direction:column;gap:7px;}
  .rz-row{display:flex;align-items:center;gap:10px;font-size:13.5px;min-width:0;}
  .rz-lab{width:3em;flex:none;color:var(--muted);}
  .rz-track{position:relative;flex:1;height:13px;border-radius:7px;background:#0d0b07;border:1px solid var(--line);overflow:hidden;min-width:0;}
  .rz-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--gold-dim);opacity:.5;}
  .rz-fill{position:absolute;top:0;bottom:0;}
  .rz-fill.pos{left:50%;background:linear-gradient(90deg,#2b5a64,var(--cyan));border-radius:0 6px 6px 0;}
  .rz-fill.neg{right:50%;background:linear-gradient(270deg,#7a2e29,var(--red));border-radius:6px 0 0 6px;}
  .rz-val{flex:none;min-width:6.4em;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .rz-val.pos{color:var(--cyan);} .rz-val.neg{color:#e08b82;} .rz-val.zero{color:var(--faint);}
  /* 法術書 */
  .spl-grp{display:flex;flex-direction:column;gap:4px;margin-bottom:4px;}
  .spl{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:5px 2px;border-bottom:1px dotted var(--line);min-width:0;}
  .spl-n{font-weight:600;color:var(--ink);min-width:0;overflow-wrap:anywhere;}
  .spl-c{flex:none;} .spl-e{color:var(--muted);font-size:12.5px;flex:1 1 100%;}
  @media (min-width:561px){ .spl-e{flex:1 1 auto;} }
  /* 告示板可點卡 / 商店不可購買列 */
  .quest.tappable{padding:10px 8px;border-bottom:1px solid var(--line);}
  .inv-row.unaffordable{opacity:.5;}
  /* 升級 CTA + 麵包屑 + 手機 2 欄 */
  .opt.cta{ border-color:var(--gold-soft); background:linear-gradient(#2a2010,#1c150b); color:var(--gold);
    font-weight:700; box-shadow:0 0 16px rgba(214,178,92,.16); }
  .loc.brief{ padding:11px 15px; }
  .loc-brief{ font-size:15px; color:var(--ink); display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  @media (max-width:430px){
    .btns{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .btns button.opt{ flex:none; width:auto; }
    .btns button.back, .btns button.opt.cta{ grid-column:1 / -1; }
  }
  /* 可點內容列 */
  .tappable{ cursor:pointer; border-radius:7px; transition:background .1s, border-color .1s; }
  .tappable:hover{ background:rgba(214,178,92,.08); }
  .tappable:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }
  .inv-row.tappable{ padding:9px 8px; border-bottom:1px solid var(--line); }
  .ex.tappable:hover{ border-color:var(--gold-soft); background:#1d1810; }
  /* log/flavor 行 */
  .logline{padding:1px 4px;color:var(--ink);font-size:14px;line-height:1.5;}
  .logline span{white-space:pre-wrap;}
  .logline + .logline{margin-top:-5px;}
  /* 故事日誌(R112 雙區:上「本回合」=最新行動&後果緊貼輸入區零捲動;下「故事日誌」=順時序歷史) */
  #log{ display:none; flex-direction:column; margin-top:12px; overflow:hidden;
    border:1px solid var(--gold-soft); border-radius:11px;
    background:linear-gradient(#13100a,#0e0b07); box-shadow:var(--shadow); }
  #log .j-head{ font-family:var(--serif); color:var(--gold-dim); font-weight:700; font-size:12.5px;
    letter-spacing:.12em; padding:8px 14px 7px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px; }
  #log .j-head::after{ content:""; flex:1; height:1px; background:linear-gradient(to right,var(--gold-soft),transparent); }
  #log .j-head.j-hist{ border-top:1px solid var(--line); }
  #log .jlatest{ padding:8px 12px 10px; background:linear-gradient(#161209,#13100a); }
  /* 歷史區(標題+捲動體)在首回合退役前整組隱藏(#log.has-hist 由 JS 掛上) */
  #log .j-hist, #log .jbody{ display:none; }
  #log.has-hist .j-hist{ display:flex; }
  #log.has-hist .jbody{ display:block; }
  #log .jbody{ overflow-y:auto; max-height:clamp(150px,34vh,380px); padding:8px 12px 10px;
    scrollbar-width:thin; scrollbar-color:var(--gold-dim) transparent; -webkit-overflow-scrolling:touch; }
  #log .jbody::-webkit-scrollbar{ width:7px; } #log .jbody::-webkit-scrollbar-thumb{ background:var(--gold-dim); border-radius:4px; }
  #log .jturn{ height:1px; margin:9px 4px; background:linear-gradient(to right,transparent,var(--line),transparent); }
  #log .jentry{ animation:settle .18s ease; }
  @media (prefers-reduced-motion:reduce){ #screen > *, #log .jentry { animation:none; } }
</style>

<body>
<div id="app">
  <header id="masthead">
    <div class="brand">流 亡 者</div>
    <div class="orn">⚔ ◈ ✦ ◈ ⚔</div>
    <div id="status"><span id="dot" class="off"></span><span id="conn">連線中…</span></div>
  </header>
  <div id="hud"></div>
  <div id="screen"></div>
  <div id="prompt"></div>
  <div id="log"></div>
  <footer id="foot">數字鍵 1–9 快速選擇 · 0 返回 · Enter 確認</footer>
</div>
<script>
(function () {
  const screenEl = document.getElementById("screen");
  const logEl = document.getElementById("log");
  const promptEl = document.getElementById("prompt");
  const dot = document.getElementById("dot");
  const conn = document.getElementById("conn");
  let curPid = null, locked = false, flatButtons = [], backButton = null;
  let journalSeq = -1, lastLogSig = "";   // 故事日誌:seq 去重(斷線重連)+ 內容簽名去重(僅對 backend resend 幀,防 int 越界重送重記)

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
  function elFrom(html) { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }

  function meter(lab, cur, max, cls) {
    const pct = Math.max(0, Math.min(100, max > 0 ? cur / max * 100 : 0));
    return `<div class="meter ${cls}"><span class="m-lab">${esc(lab)}</span>`
         + `<div class="m-track"><div class="m-fill" style="width:${pct}%"></div></div>`
         + `<span class="m-val">${cur}/${max}</span></div>`;
  }
  function metersBlock(d) {
    return `<div class="meters">${meter("生命",d.hp[0],d.hp[1],"hp")}`
         + `${meter("魔力",d.mp[0],d.mp[1],"mp")}${meter("體力",d.fp[0],d.fp[1],"fp")}</div>`;
  }

  // --- view 元件 -------------------------------------------------------
  // (舊 renderStatus「status 卡」已移除:web 從不發送 status block,即時狀態改由常駐 HUD renderHud 顯示。)
  function renderLocation(d) {
    const danger = d.danger ? `<span class="chip red">⚠ 危險度 ${d.danger}</span>` : "";
    let exitsHtml = "";
    if (d.exits && d.exits.length) {
      exitsHtml = `<div class="loc-exits"><span class="lab">出口</span>`
        + d.exits.map(function (e) { return `<span class="ex"${e.key ? ` data-key="${esc(e.key)}"` : ""}>${esc(e.name)}<span class="h">${e.hours}時</span></span>`; }).join("")
        + `</div>`;
    }
    if (d.brief) {     // 同地點重複回合:麵包屑(名·類型·危險度 + 可點出口),不重畫整張卡
      return elFrom(`<div class="card loc brief"><div class="loc-brief">📍 <b>${esc(d.name)}</b>`
        + `<span class="dim"> · ${esc(d.type)}</span>${danger}</div>${exitsHtml}</div>`);
    }
    let lines = "";
    if (d.landmark) lines += `<div class="loc-line"><span class="lab">❖ 已發現</span>${esc(d.landmark.name)}`
      + (d.landmark.revisit ? `<div class="faint" style="font-size:12.5px">${esc(d.landmark.revisit)}</div>` : "") + `</div>`;
    if (d.ruler) {
      lines += `<div class="loc-line"><span class="lab">👑 統治者</span>${esc(d.ruler.title)}·${esc(d.ruler.name)}`
        + `<span class="dim">（大空位·自治)</span></div>`;
      const flag = d.bloc ? `${esc(d.faction)}·${esc(d.bloc)}` : esc(d.faction || "");
      if (flag) lines += `<div class="loc-line"><span class="lab">🏴 旗號</span>${flag}</div>`;
    }
    (d.tracked || []).forEach(function (t) {   // R114 F3:常駐追蹤中任務(免每次開任務日誌)
      lines += `<div class="loc-line"><span class="lab">▶ 任務</span><span style="color:#7fd0d8">${esc(t)}</span></div>`;
    });
    return elFrom(
      `<div class="card loc"><div class="card-head">📍 ${esc(d.name)}`
      + `<span class="dim">· ${esc(d.province)}（${esc(d.type)}）</span>${danger}</div>`
      + `<div class="loc-desc">${esc(d.desc)}</div>${lines}${exitsHtml}</div>`);
  }
  function renderSheet(d) {
    const right = [];
    right.push(`<div class="kv"><span class="lab">負重</span>上限 ${d.encumbrance}　<span class="lab">金幣</span>${d.gold}</div>`);
    right.push(`<div class="kv"><span class="lab">武器</span>${esc(d.weapon)}</div>`);
    if (d.armor) right.push(`<div class="kv"><span class="lab">護甲</span>${d.armor}</div>`);
    if (d.resist) right.push(`<div class="kv"><span class="lab">抗性</span>${esc(d.resist)}</div>`);
    right.push(`<div class="kv"><span class="lab">聲望</span>${d.fame}${d.infamy ? "　惡名 " + d.infamy : ""}${d.bounty ? "　<span style='color:#e08b82'>通緝 " + d.bounty + "</span>" : ""}</div>`);

    const attrs = `<div class="attrs">` + d.attrs.map(function (a) {
      return `<div class="attr"><span>${a.favored ? '<span class="star">★</span>' : ""}${esc(a.name)}</span><span class="v">${a.value}</span></div>`;
    }).join("") + `</div>`;

    const cols = ["combat", "magic", "stealth"].map(function (s) {
      const rows = d.skills[s].map(function (k) {
        return `<div class="sk"><span class="nm">${k.major ? '<span class="mj">✦</span> ' : "· "}${esc(k.name)}</span><span class="lv">${k.level}</span></div>`;
      }).join("");
      return `<div class="skcol ${s}"><h4>${esc(d.spec_names[s])}</h4>${rows}</div>`;
    }).join("");

    let extra = "";
    if (d.origin) extra += `<div class="efx" style="color:var(--gold-dim)">出身　${esc(d.origin)}${d.origin_blurb ? ` <span class="faint">— ${esc(d.origin_blurb)}</span>` : ""}</div>`;
    if (d.intro_quest) extra += `<div class="efx" style="color:#7fd0d8">🧭 起手　${esc(d.intro_quest.name)}:${esc(d.intro_quest.objective)}</div>`;
    if (d.guilds && d.guilds.length) extra += `<div class="efx" style="color:var(--gold-dim)">公會　${d.guilds.map(esc).join("、")}</div>`;
    if (d.effects && d.effects.length) extra += `<div class="efx">效果　${d.effects.map(esc).join("、")}</div>`;
    let mast = "";
    if (d.masteries && d.masteries.length) {
      mast = `<div class="sec-title">技能里程碑</div>` + d.masteries.map(function (m) {
        return `<div class="mast"><span class="mn">✦ ${esc(m.name)}</span>（${esc(m.skill)} ${m.threshold}）<span class="md">${esc(m.desc)}</span></div>`;
      }).join("");
    }
    return elFrom(
      `<div class="card sheet"><div class="card-head">${esc(d.name)}</div>`
      + `<div class="sheet-sub">${esc(d.race)} · ${esc(d.sex)} · ${esc(d.sign)} · ${esc(d.cls)}（${esc(d.spec)}專精）`
      + `　等級 ${d.level} · 經驗 ${d.level_xp[0]}/${d.level_xp[1]}</div>`
      + `<div class="sheet-grid"><div class="sheet-res">${metersBlock(d)}${right.join("")}</div>`
      + `<div class="sheet-attrs"><div class="sec-title">屬性</div>${attrs}</div></div>`
      + `<div class="sec-title">技能 <span class="faint" style="font-weight:400">✦=主修</span></div>`
      + `<div class="skills">${cols}</div>${mast}${extra}</div>`);
  }
  function renderDivider(d) {
    return elFrom(`<div class="divider">${d.title ? esc(d.title) : ""}</div>`);
  }
  function bar(cur, max, cls) {
    const p = max > 0 ? Math.max(0, Math.min(100, cur / max * 100)) : 0;
    return `<div class="m-track"><div class="m-fill ${cls}" style="width:${p}%"></div></div>`;
  }
  function renderCombat(d) {

  // 里程碑:按 系統→技能 折疊的手風琴;節點配對卡(二選一 A|B 並列)+ ✦已選/◆待選/○未達 三態。

    function opts(nd) {
      if (nd.state === "chosen") {
        const o = nd.options[0] || { name: "", desc: "" };
        const fg = (nd.foregone && nd.foregone.length) ? `<span class="mn-fg">放棄 ${nd.foregone.map(esc).join("、")}</span>` : "";
        return `<div class="mn-opt sole chosen"><span class="mn-on">${esc(o.name)}${fg}</span><span class="mn-od">${esc(o.desc)}</span></div>`;

    function skill(sk) {
      const exp = sk.has_pending;   // 預設只展開有待選的技能

      const pend = sk.counts.pending ? ` · <span class="msk-pend">待選 ${sk.counts.pending}</span>` : "";

      return `<div class="mskill${exp ? " exp" : ""}">`
        + `<div class="msk-head" tabindex="0" role="button" aria-expanded="${exp}"><span class="msk-caret">${exp ? "▾" : "▸"}</span>`
        + `<span class="msk-name">${esc(sk.skill)}</span><span class="msk-dots">${dots}</span>${meta}</div>`

    });
    return card;
  }
  function renderAchievements(d) {

  function renderShop(d) {

  function renderOrigins(d) {

  const VIEWS = {

  function htmlBlock(html) {
    const pre = document.createElement("pre");
    pre.className = "art";
    pre.innerHTML = html;            // rich export(裸 <span>);伺服器產生、可信
    return pre;
  }

  // #screen = 當前狀態快照(view/html);log 敘事改入常駐故事日誌。
  function renderScreen(blocks) {

      if (b.kind === "view") {
        const fn = VIEWS[b.name];

  // --- 輸入 ------------------------------------------------------------
  function submit(value) {
    if (locked || curPid === null) return;
    locked = true; promptEl.classList.add("locked");
    fetch("/input", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt_id: curPid, value: value }),
    }).catch(function () { locked = false; promptEl.classList.remove("locked"); });
  }
  function mkButton(label, value, idx, chips) {
    const b = document.createElement("button");
    b.className = "opt";
    b._key = value;
    if (idx != null) { const n = document.createElement("span"); n.className = "num"; n.textContent = idx; b.appendChild(n); }
    b.appendChild(document.createTextNode(label));
    if (chips && chips.length) {
      const cc = document.createElement("div"); cc.className = "opt-chips";
      chips.forEach(function (c) {
        const s = document.createElement("span");
        s.className = "chip" + (c.tone ? " " + c.tone : "");
        s.textContent = c.text; cc.appendChild(s);
      });
      b.appendChild(cc);
    }
    b.addEventListener("click", function () { submit(value); });
    return b;
  }
  function renderPrompt(spec) {
    promptEl.innerHTML = ""; promptEl.classList.remove("locked");
    flatButtons = []; backButton = null;
    if (!spec) return;
    const t = spec.type;
    if (t === "end") {
      const e = document.createElement("div"); e.className = "end";
      e.textContent = "（遊戲結束 —— 重新整理頁面可再啟一局)"; promptEl.appendChild(e); curPid = null; return;
    }
    if (spec.title) { const h = document.createElement("div"); h.className = "ptitle"; h.textContent = spec.title; promptEl.appendChild(h); }
    if (t === "menu") {
      const box = document.createElement("div"); box.className = "btns";
      // 帶屬性 chips 的選卡選單(種族/星座/職業/開局)→ 等寬 grid,避免孤卡撐滿整排
      if (spec.options.some(function (o) { return o.chips && o.chips.length; })) box.classList.add("cardgrid");
      spec.options.forEach(function (o, i) { const b = mkButton(o.label, o.key, i + 1, o.chips); flatButtons.push(b); box.appendChild(b); });
      promptEl.appendChild(box);
      if (spec.allow_back) { const b = mkButton("返回", null, 0); b.classList.add("back"); backButton = b; promptEl.appendChild(b); }
    } else if (t === "grouped") {
      const cta = {}; (spec.cta_keys || []).forEach(function (k) { cta[k] = true; });
      const ctaBox = document.createElement("div"); ctaBox.className = "btns";   // CTA(如升級)置頂、金框、不佔數字鍵
      spec.groups.forEach(function (g) {
        g.options.forEach(function (o) { if (cta[o.key]) { const b = mkButton(o.label, o.key, null); b.classList.add("cta"); ctaBox.appendChild(b); } });
      });
      if (ctaBox.children.length) promptEl.appendChild(ctaBox);
      let i = 0;
      spec.groups.forEach(function (g) {
        const vis = g.options.filter(function (o) { return !cta[o.key]; });
        if (!vis.length) return;
        if (g.header) { const h = document.createElement("div"); h.className = "ghead"; h.textContent = g.header; promptEl.appendChild(h); }
        const box = document.createElement("div"); box.className = "btns";
        vis.forEach(function (o) { i += 1; const b = mkButton(o.label, o.key, i); flatButtons.push(b); box.appendChild(b); });
        promptEl.appendChild(box);
      });
    } else if (t === "confirm") {
      if (spec.prompt) { const h = document.createElement("div"); h.className = "ptitle"; h.textContent = spec.prompt; promptEl.appendChild(h); }
      const box = document.createElement("div"); box.className = "btns";
      const y = mkButton("是", true, 1), n = mkButton("否", false, 2);
      y.classList.add("yes"); n.classList.add("no"); flatButtons.push(y, n); box.appendChild(y); box.appendChild(n);
      promptEl.appendChild(box);
    } else if (t === "int" || t === "text") {
      if (spec.prompt) { const h = document.createElement("div"); h.className = "ptitle"; h.textContent = spec.prompt; promptEl.appendChild(h); }
      const row = document.createElement("div"); row.className = "row";
      const inp = document.createElement("input"); inp.className = "field";
      if (t === "int") { inp.type = "number"; inp.inputMode = "numeric";
        if (spec.lo != null) inp.min = spec.lo; if (spec.hi != null) inp.max = spec.hi; if (spec.default != null) inp.value = spec.default;
      } else { inp.type = "text"; if (spec.default != null) inp.value = spec.default; }
      const go = document.createElement("button"); go.className = "go"; go.textContent = "確定";
      function send() {
        if (t !== "int") { submit(inp.value); return; }
        const raw = inp.value.trim(); let n;
        if (raw === "") { if (spec.default == null) { inp.focus(); return; } n = Number(spec.default); }
        else { n = Number(raw); if (!Number.isFinite(n)) { inp.focus(); return; } }
        submit(n);
      }
      go.addEventListener("click", send);
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });
      row.appendChild(inp); row.appendChild(go); promptEl.appendChild(row);
      if (t === "int" && spec.lo != null) { const h = document.createElement("div"); h.className = "hint"; h.textContent = "範圍 " + spec.lo + "–" + spec.hi; promptEl.appendChild(h); }
      setTimeout(function () { inp.focus(); inp.select(); }, 0);
    }
  }

  const hudEl = document.getElementById("hud");
  function hudMeter(cur, max, cls) {
    const p = max > 0 ? Math.max(0, Math.min(100, cur / max * 100)) : 0;
    return `<span class="t"><span class="f ${cls}" style="width:${p}%"></span></span><span class="v">${cur}/${max}</span>`;
  }
  function renderHud(d) {
    if (!d) { hudEl.style.display = "none"; hudEl.innerHTML = ""; return; }
    hudEl.style.display = "flex";
    let chips = "";
    if (d.vampire) chips += `<span class="h-chip red">🩸 ${esc(d.vampire)}</span>`;
    if (d.cover) chips += `<span class="h-chip gold">${esc(d.cover)}</span>`;
    if (d.blessing) chips += `<span class="h-chip cyan">${esc(d.blessing)}</span>`;
    if (d.renown) chips += `<span class="h-chip gold">${esc(d.renown)}</span>`;   // R101 名聲稱號(live)
    if (d.souls) chips += `<span class="h-chip mag">魂 ${d.souls}</span>`;         // R106 死靈師靈魂 token
    // R114 資訊可見性:持續狀態(詛咒/成癮/病)紅 chip;限時增益折成一顆「✨增益×N」帶 title 明細
    (d.statuses || []).forEach(function (s) { chips += `<span class="h-chip red">${esc(s)}</span>`; });
    if ((d.buffs || []).length) {
      const detail = d.buffs.map(function (b) { return b.label + (b.remain != null ? "(餘" + b.remain + "時)" : ""); }).join("、");
      chips += `<span class="h-chip cyan" title="${esc(detail)}">✨ 增益×${d.buffs.length}</span>`;
    }
    if (d.encumbered) chips += `<span class="h-chip red">⚖ 負重將滿</span>`;
    if (d.bounty) chips += `<span class="h-chip red">通緝 ${d.bounty}</span>`;
    if (d.can_level) chips += `<span class="h-chip gold">★ 可升級</span>`;
    const team = (d.party || []).map(function (p) {
      return `<span class="h-team${p.downed ? " down" : ""}">└ ${esc(p.name)} ${p.hp[0]}/${p.hp[1]}${p.downed ? " 負傷" : ""}</span>`;
    }).concat((d.allies || []).map(function (a) {
      return `<span class="h-team summon">└ ${esc(a.name)}(召) ${a.hp[0]}/${a.hp[1]}${a.turns != null ? " ·" + a.turns : ""}</span>`;
    })).join("");
    hudEl.innerHTML =
      `<span class="h-meta"><span class="h-name">❖ ${esc(d.name)}</span><span class="h-lv">Lv.${d.level}</span>`
      + `<span class="h-gold">金 ${d.gold}</span>${chips}`
      + `<span class="h-time">◷ ${esc(d.time)}</span></span>`
      + `<span class="h-vitals">`
      + `<span class="hm"><span class="l">血</span>${hudMeter(d.hp[0], d.hp[1], "hp")}</span>`
      + `<span class="hm"><span class="l">魔</span>${hudMeter(d.mp[0], d.mp[1], "mp")}</span>`
      + `<span class="hm"><span class="l">體</span>${hudMeter(d.fp[0], d.fp[1], "fp")}</span>`
      + `</span>`
      + (team ? `<span class="h-team-wrap">${team}</span>` : "");
  }

  // --- 故事日誌(R112 雙區:上「本回合」+ 下「故事日誌」歷史;空回合上區 sticky)-------
  function journalZones() {
    // R112 雙區:上「本回合」(aria-live 朗讀新敘事)+ 下「故事日誌」(順時序歷史;首回合退役前隱藏)
    if (!logEl.firstChild) {
      logEl.innerHTML = '<div class="j-head">⚔ 本回合</div>'
        + '<div class="jlatest" aria-live="polite" aria-label="本回合"></div>'
        + '<div class="j-head j-hist">📜 故事日誌</div>'
        + '<div class="jbody" aria-label="故事日誌"></div>';
      logEl.style.display = "flex";
    }
    return { latest: logEl.querySelector(".jlatest"), body: logEl.querySelector(".jbody") };
  }
  function appendJournal(logBlocks, isResend) {
    if (!logBlocks.length) return;
    const sig = logBlocks.map(function (b) { return b.html; }).join("");
    if (isResend && sig === lastLogSig) return;            // 同內容重送(int 越界重提示)→ 不重覆記
    lastLogSig = sig;
    const z = journalZones();
    if (z.latest.children.length) {                        // 上一回合退役 → 移入歷史區尾端(維持順時序)
      // 錨定守衛:使用者本來就在歷史底部才跟捲;往上捲讀舊文時不拽動(修 R58 硬拽回底 bug)
      const atBottom = z.body.scrollHeight - z.body.scrollTop - z.body.clientHeight < 8;
      if (z.body.children.length) { const sep = document.createElement("div"); sep.className = "jturn"; z.body.appendChild(sep); }
      while (z.latest.firstChild) {
        const n = z.latest.firstChild;
        if (n.classList) n.classList.remove("jentry");     // 退役不重播進場動畫
        z.body.appendChild(n);
      }
      while (z.body.children.length > 240) z.body.removeChild(z.body.firstChild);   // 上限滾動
      while (z.body.firstChild && z.body.firstChild.classList.contains("jturn")) z.body.removeChild(z.body.firstChild);
      logEl.classList.add("has-hist");
      if (atBottom) z.body.scrollTop = z.body.scrollHeight;
    }
    logBlocks.forEach(function (b) {                       // 本回合區:最新敘事(緊貼輸入區,零捲動)
      const d = document.createElement("div"); d.className = "logline jentry"; d.innerHTML = b.html; z.latest.appendChild(d);
    });
  }

  // 可點內容列:view 列若帶 data-key 且該 key 是當前 prompt 的合法選項(含 extra_keys)→ 列可點。
  //  - 對應到某個選單按鈕的(optKey):移除重複按鈕,該列接管其數字鍵槽(如背包物品)。
  //  - 屬 extra_keys 的(無對應按鈕):只可點/觸控,不佔數字鍵(如地點出口,hub 按鈕數字維持原樣)。
  function wireActionableRows(spec) {
    if (!spec || (spec.type !== "menu" && spec.type !== "grouped")) return;
    const opts = spec.type === "menu" ? (spec.options || [])
      : spec.groups.reduce(function (a, g) { return a.concat(g.options); }, []);
    const optKey = {}; opts.forEach(function (o) { optKey[o.key] = true; });
    const extra = {}; (spec.extra_keys || []).forEach(function (k) { extra[k] = true; });
    const replace = [];           // 取代選單按鈕的列(可用數字鍵)
    let any = false;
    screenEl.querySelectorAll("[data-key]").forEach(function (el) {
      const k = el.getAttribute("data-key");
      if ((optKey[k] || extra[k]) && !el._wired) {
        el._wired = true; el.classList.add("tappable"); el.setAttribute("tabindex", "0");
        el.addEventListener("click", function () { submit(k); });
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); submit(k); }
        });
        any = true;
        // R113:地城方向鍵(go:*)不接管按鈕 —— 格子可點之餘保留「往北/南…」標籤按鈕與其數字鍵
        //(否則方向標籤整組消失、數字槽移給無標籤格子,鍵盤玩家無從對映)
        if (optKey[k] && k.indexOf("go:") !== 0) replace.push(k);
      }
    });
    if (!any || !replace.length) return;
    const covered = {}; replace.forEach(function (k) { covered[k] = true; });
    const remaining = [];
    flatButtons.forEach(function (b) {
      if (b._key !== undefined && covered[b._key]) b.remove(); else remaining.push(b);
    });
    promptEl.querySelectorAll(".btns").forEach(function (box) {   // 清掉空掉的分組標題
      if (!box.children.length) {
        const h = box.previousElementSibling;
        if (h && h.classList.contains("ghead")) h.remove();
        box.remove();
      }
    });
    flatButtons = replace.map(function (k) {     // 數字鍵:取代列在前,其餘按鈕在後
      return { click: function () { if (!locked) submit(k); } };
    }).concat(remaining);
  }

  let curSpec = null;   // 當前 prompt spec(R113:方向鍵對映查此)
  function render(frame) {
    const prev = promptEl.querySelector("input.field");
    const prevVal = prev ? prev.value : null;
    const samePrompt = (curPid !== null && frame.prompt_id === curPid);
    const blocks = frame.blocks || [];
    const stateBlocks = blocks.filter(function (b) { return b.kind === "view" || b.kind === "html" || b.kind === "clear"; });
    const logBlocks = blocks.filter(function (b) { return b.kind === "log"; });
    renderHud(frame.hud);
    if (stateBlocks.length) renderScreen(stateBlocks);   // 只在有新狀態時替換;純敘事幀保留前畫面
    const fresh = (frame.seq == null) || (frame.seq > journalSeq);
    if (fresh) { appendJournal(logBlocks, frame.resend); if (frame.seq != null) journalSeq = frame.seq; }   // 重連重送(seq≤)由 seq gate 擋;int 越界重送(resend)由內容簽名擋
    curPid = frame.prompt_id; locked = false; curSpec = frame.prompt;
    renderPrompt(frame.prompt);
    wireActionableRows(frame.prompt);
    if (samePrompt && prevVal != null) { const inp = promptEl.querySelector("input.field"); if (inp) inp.value = prevVal; }
    // R113 閱讀動線:帶新敘事的幀 → 選單置中(上瞥狀態、下瞥「本回合」皆可及;頁面塞得下時無感);
    // 純狀態幀維持捲頂。修「每幀捲頂但敘事在頁底 → 每次行動都要往下捲」。
    if (!samePrompt) {
      if (fresh && logBlocks.length && document.documentElement.scrollHeight > window.innerHeight + 4) {
        promptEl.scrollIntoView({ block: "center" });
      } else {
        window.scrollTo(0, 0);
      }
    }
  }

  // 數字鍵快捷(<10 即時;>=10 緩衝多位數,R113:不可能再延伸時立即送出免 450ms 稅)
  let digitBuf = "", digitTimer = null;
  function clickIdx(i) { const b = flatButtons[i - 1]; if (b) b.click(); }
  function resolveBuf() { if (digitTimer) { clearTimeout(digitTimer); digitTimer = null; } const i = parseInt(digitBuf, 10); digitBuf = ""; if (i >= 1) clickIdx(i); }
  // R113 地城方向鍵:當前 prompt 含 go:n/s/w/e 選項(選單鍵或 extra_keys)才吃方向鍵
  const ARROW_DIR = { ArrowUp: "go:n", ArrowDown: "go:s", ArrowLeft: "go:w", ArrowRight: "go:e" };
  function specHasKey(k) {
    if (!curSpec) return false;
    if ((curSpec.extra_keys || []).indexOf(k) >= 0) return true;
    const opts = curSpec.type === "menu" ? (curSpec.options || [])
      : curSpec.type === "grouped" ? curSpec.groups.reduce(function (a, g) { return a.concat(g.options); }, []) : [];
    return opts.some(function (o) { return o.key === k; });
  }
  document.addEventListener("keydown", function (e) {
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key >= "0" && e.key <= "9") {
      e.preventDefault();
      if (flatButtons.length < 10) { if (e.key === "0") { if (backButton) backButton.click(); } else clickIdx(parseInt(e.key, 10)); return; }
      if (e.key === "0" && !digitBuf) { if (backButton) backButton.click(); return; }   // 大選單(≥10):0(非多位數接續)= 返回(選項編號恆 1+,首位 0 必為返回)
      digitBuf += e.key; if (digitTimer) clearTimeout(digitTimer);
      // 已達位數上限 或 再接一位必超出總數(buf×10 > N)→ 立即送出;否則短緩衝等第二位
      if (digitBuf.length >= String(flatButtons.length).length
          || parseInt(digitBuf, 10) * 10 > flatButtons.length) resolveBuf();
      else digitTimer = setTimeout(resolveBuf, 450);
    } else if (e.key === "Enter" && digitBuf) { e.preventDefault(); resolveBuf(); }
    else if (ARROW_DIR[e.key] && (specHasKey("go:n") || specHasKey("go:s") || specHasKey("go:w") || specHasKey("go:e"))) {
      // 地城情境(spec 含任一方向)→ 方向鍵一律接管:存在的方向=移動,邊界缺的方向=無動作
      //(不 preventDefault 會變成「往北移動、往南捲頁」的不一致;非地城 spec 無 go:* → 方向鍵照常捲頁)
      e.preventDefault();
      const dk = ARROW_DIR[e.key];
      if (specHasKey(dk) && !locked) submit(dk);
    }
    else if (e.key === "Escape" && backButton) { e.preventDefault(); backButton.click(); }   // Esc=返回(原 "0" 分支不可達之死碼移除)
  });

  function connect() {
    const es = new EventSource("/events");
    es.onopen = function () { dot.classList.remove("off"); hudEl.classList.remove("off"); conn.textContent = "已連線"; };
    es.onerror = function () { dot.classList.add("off"); hudEl.classList.add("off"); conn.textContent = "重新連線中…"; };
    es.onmessage = function (ev) { try { render(JSON.parse(ev.data)); } catch (_) {} };
  }
  connect();
})();
</script>
</body>
</html>
