[project]
name = "tesrpg"
version = "0.1.0"
description = "流亡者 — 上古卷軸風格的技能驅動沙盒文字 RPG (terminal CLI)"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tesrpg = "tesrpg.main:main"

[tool.setuptools.packages.find]
include = ["tesrpg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
